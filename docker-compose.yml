# Docker Compose for Local Machine (Mac Mini)
# Local: media-server, jellyfin, jellyseerr, cloudflared
# SVCME-50 (192.168.255.50): qbittorrent, prowlarr
# SVCME-51 (192.168.255.51): radarr, sonarr, bazarr

services:
  media-server:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: media-server
    ports:
      - "7100:3000"
    volumes:
      - ./data:/data
      - ./config/radarr:/config/radarr:ro
      - ./config/sonarr:/config/sonarr:ro
      - ./config/prowlarr:/config/prowlarr:ro
      - ./config/jellyseerr:/config/jellyseerr:ro
    environment:
      - JELLYFIN_URL=http://jellyfin:8096
      - JELLYFIN_EXTERNAL_URL=http://localhost:7500
      - JELLYSEERR_URL=http://jellyseerr:5055
      - JELLYSEERR_CONFIG_PATH=/config/jellyseerr/settings.json
      - JELLYSEERR_EXTERNAL_URL=http://localhost:7600
      - RADARR_URL=http://192.168.255.51:7400
      - RADARR_EXTERNAL_URL=http://192.168.255.51:7400
      - RADARR_CONFIG_PATH=/config/radarr/config.xml
      - SONARR_URL=http://192.168.255.51:7700
      - SONARR_EXTERNAL_URL=http://192.168.255.51:7700
      - SONARR_CONFIG_PATH=/config/sonarr/config.xml
      - PROWLARR_URL=http://192.168.255.50:7300
      - PROWLARR_CONFIG_PATH=/config/prowlarr/config.xml
      - BAZARR_URL=http://192.168.255.51:7800
      - BAZARR_EXTERNAL_URL=http://192.168.255.51:7800
      - QBITTORRENT_URL=http://192.168.255.50:7200
      - QBITTORRENT_USERNAME=admin
      - QBITTORRENT_PASSWORD=admin@123456
      - DOWNLOADS_PATH=/data/torrents
      - MEDIA_PATH=/data/media
    depends_on:
      - jellyfin
    networks:
      media-network:
        ipv4_address: 172.20.0.16
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    profiles:
      - remote-access
    command: tunnel --no-autoupdate --protocol http2 --loglevel debug run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    depends_on:
      - media-server
    networks:
      media-network:
        ipv4_address: 172.20.0.17
    restart: unless-stopped

  jellyfin:
    image: lscr.io/linuxserver/jellyfin:10.8.13
    container_name: jellyfin
    ports:
      - "7500:8096"
      - "8096:8096"
    environment:
      - PUID=501
      - PGID=20
      - TZ=America/Toronto
    volumes:
      - ./config/jellyfin:/config
      - /Volumes/media-data/media:/data/media:ro
      - ./config/jellyfin/main.jellyfin.bundle.js:/usr/share/jellyfin/web/main.jellyfin.bundle.js:ro
    networks:
      media-network:
        ipv4_address: 172.20.0.10
    restart: unless-stopped

  jellyseerr:
    image: fallenbagel/jellyseerr:latest
    container_name: jellyseerr
    ports:
      - "7600:5055"
    environment:
      - LOG_LEVEL=info
      - TZ=America/Toronto
    volumes:
      - ./config/jellyseerr:/app/config
      - ./config/jellyseerr/jellyfin.js:/app/dist/api/jellyfin.js:ro
    networks:
      media-network:
        ipv4_address: 172.20.0.15
    restart: unless-stopped

networks:
  media-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
